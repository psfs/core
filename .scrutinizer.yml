filter:
  excluded_paths:
    - src/bin/*
    - src/command/*
    - src/tests/*
    - src/public/*
    - src/templates/*
    - locale/*
    - cache/*
    - config/*
    - logs/*
    - tests/*
    - tests_api/*
    - tools/*
  dependency_paths:
    - vendor/

checks:
  php: true

tools:
  php_cs_fixer:
    config:
      level: psr12

build:
  environment:
    docker: true
    variables:
      PHP_VERSION: "8.3"
      DEBUG: "-xdebug"
  nodes:
    analysis:
      commands:
        - checkout-code ~/build
        - cd ~/build && docker-compose -f docker-compose.scrutinizer.yml up -d php redis
        - cd ~/build && docker-compose -f docker-compose.scrutinizer.yml exec -T php composer install -o --no-interaction --no-progress --prefer-dist --classmap-authoritative
        - cd ~/build && php-scrutinizer-run

    services-tests:
      commands:
        - checkout-code ~/build
        - cd ~/build && docker-compose -f docker-compose.scrutinizer.yml up -d php db redis
        - cd ~/build && docker-compose -f docker-compose.scrutinizer.yml exec -T php composer install -o --no-interaction --no-progress --prefer-dist --classmap-authoritative
        - cd ~/build && docker-compose -f docker-compose.scrutinizer.yml exec -T -e SERVICE_MYSQL_IP=db -e API_DB_PASSWORD=psfs -e API_DB_NAME=core_test -e PSFS_REDIS_HOST=redis php sh scrutinizer-setup.sh
        - command: cd ~/build && docker-compose -f docker-compose.scrutinizer.yml exec -T -e SERVICE_MYSQL_IP=db -e PSFS_REDIS_HOST=redis php sh scrutinizer-tests.sh
          idle_timeout: 1200
